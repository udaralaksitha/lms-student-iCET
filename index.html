<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMS Student Management</title>
    <link rel="stylesheet" href="style.css" />

    <script src="addstudent.js" defer></script>
    <script src="updatestudent.js" defer></script>
    <script src="deletestudent.js" defer></script>
  </head>
  <body>
    <header>
      <h1>LMS Student Management System</h1>
      <p>Add, update and delete student records</p>
    </header>

    <main class="container">
      <!-- ADD STUDENT -->
      <section class="card">
        <h2>Add Student</h2>

        <form id="addStudentForm">
          <label for="addId">Student ID</label>
          <input type="text" id="addId" required />

          <label for="addName">Full Name</label>
          <input type="text" id="addName" required />

          <label for="addEmail">Email</label>
          <input type="email" id="addEmail" required />

          <label for="addCourse">Course</label>
          <input type="text" id="addCourse" required />

          <button type="submit" class="add-btn">Add Student</button>

          <p id="addMessage" class="message" role="status"></p>
        </form>
      </section>

      <!-- UPDATE STUDENT -->
      <section class="card">
        <h2>Update Student</h2>

        <form id="updateStudentForm">
          <label for="updateId">Student ID</label>
          <input type="text" id="updateId" required />

          <label for="updateName">New Full Name</label>
          <input type="text" id="updateName" required />

          <label for="updateEmail">New Email</label>
          <input type="email" id="updateEmail" required />

          <label for="updateCourse">New Course</label>
          <input type="text" id="updateCourse" required />

          <button type="submit" class="update-btn">Update Student</button>

          <p id="updateMessage" class="message" role="status"></p>
        </form>
      </section>

      <!-- DELETE STUDENT -->
      <section class="card">
        <h2>Delete Student</h2>

        <form id="deleteStudentForm">
          <label for="deleteId">Student ID</label>
          <input type="text" id="deleteId" required />

          <button type="submit" class="delete-btn">Delete Student</button>

          <p id="deleteMessage" class="message" role="status"></p>
        </form>
      </section>

      <!-- STUDENT LIST -->
      <section class="card student-list">
        <h2>Student Records</h2>

        <button type="button" id="refreshStudents">Refresh Student List</button>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
